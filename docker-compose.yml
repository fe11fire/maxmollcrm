services:
  php:
    build:
      dockerfile: docker/php/Dockerfile
    volumes:
      - './maxmollcrm:/var/www/html'
  nginx:
    image: nginx:stable-alpine
    ports:
      - 8000:80
    volumes:
      - './maxmollcrm:/var/www/html'
      - './docker/nginx/conf.d:/etc/nginx/conf.d'
    depends_on:
      - mysql
      - php
      - phpmyadmin

  mysql:
    image: mysql:8
    ports:
      - 3316:3306
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=maxmollcrm
      - MYSQL_USER=laravel
      - MYSQL_PASSWORD=password
    volumes:
      - './docker/volume/mysql:/var/lib/mysql'

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 9090:80
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306

  artisan:
    build:
      dockerfile: docker/php/Dockerfile
    volumes:
      - './maxmollcrm:/var/www/html'
    entrypoint: ["php", "/var/www/html/artisan"]

  composer:
    build:
      dockerfile: docker/composer/Dockerfile
    volumes:
      - './maxmollcrm:/var/www/html'

  mysql-test:
    image: mysql:8
    profiles: [test]
    environment:
      MYSQL_ROOT_PASSWORD: test-root
      MYSQL_DATABASE: maxmollcrm_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 60
